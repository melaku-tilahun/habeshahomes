services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habeshahomes-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./:/var/www/habeshahomes
      - /var/www/habeshahomes/vendor
      - ./storage:/var/www/habeshahomes/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-habeshahomes}
      - DB_USERNAME=${DB_USERNAME:-habesha}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
    depends_on:
      - mysql
      - redis
      - elasticsearch
    networks:
      - habeshahomes

  mysql:
    image: mysql:8.0
    container_name: habeshahomes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-habeshahomes}
      MYSQL_USER: ${DB_USERNAME:-habesha}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    # Only bind to localhost for dev/admin access, not 0.0.0.0
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - habeshahomes

  redis:
    image: redis:7-alpine
    container_name: habeshahomes-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - habeshahomes

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: habeshahomes-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    networks:
      - habeshahomes

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  habeshahomes:
    driver: bridge
